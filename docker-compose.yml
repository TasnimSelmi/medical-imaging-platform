version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - /tmp/mediplat:/tmp/mediplat
    environment:
      - MEDIPLAT_UPLOAD_DIR=/tmp/mediplat

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
